version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: chop_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - chop_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chop_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/chop_marketplace?authSource=admin
      JWT_SECRET: your_jwt_secret_key_here
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - chop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chop_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - chop_network

volumes:
  mongodb_data:

networks:
  chop_network:
    driver: bridge
